name: Fix Cricbuzz status overflow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Fix unbounded status regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          s=p.read_text()
          old=r'''r"Day\s+\d+\s*:\s*Stumps[^|]*"'''
          new=r'''r"Day\s+\d+\s*:\s*Stumps\s*[-:]\s*[^|]{0,120}"'''
          if old not in s:
              raise SystemExit('old status regex not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Bound Cricbuzz stumps status text"
          git push
