<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cricket OBS Live Scoreboard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}body{min-height:100vh}.wrap{width:100vw;height:100vh;padding:1vw}.board{width:100%;height:100%;overflow:hidden;border-radius:18px;background:#07111f;border:2px solid rgba(255,255,255,.16);display:flex;flex-direction:column}.hero{flex:0 0 56%;min-height:0;display:grid;grid-template-columns:1fr 1.4fr 1fr;background:linear-gradient(110deg,#062d54,#081426 48%,#280913)}.side{min-width:0;padding:2vw;display:flex;align-items:center;gap:1vw}.side.right{justify-content:flex-end;text-align:right}.flag{width:5vw;height:5vw;min-width:54px;min-height:54px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:2.2vw;border:3px solid #fff}.team{font-size:clamp(24px,2.6vw,50px);font-weight:1000;text-transform:uppercase;line-height:1}.score{font-size:clamp(40px,4.6vw,90px);line-height:.95;color:#ffd21a;font-weight:1000;margin-top:.5vw;white-space:nowrap}.overs{font-size:clamp(15px,1.7vw,32px);font-weight:900;margin-top:.4vw}.bowling{font-size:clamp(14px,1.4vw,28px);font-weight:1000;color:#9edcff;margin-top:.5vw;text-transform:uppercase}.middle{min-width:0;margin:1vw .4vw;padding:.7vw;border-radius:14px;background:linear-gradient(145deg,#a80e1d,#ef1e35 52%,#9f0d1c);border:2px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.battle{font-size:clamp(18px,1.6vw,32px);font-weight:1000;font-style:italic}.vs{font-size:clamp(20px,1.8vw,36px);font-weight:1000;margin:.15vw 0}.caps{display:flex;align-items:center;justify-content:space-between;gap:.4vw;width:100%;height:min(17vw,300px)}.cap{width:42%;height:92%;padding:.35vw;border-radius:14px;background:linear-gradient(180deg,#082b4f,#041527);border:2px solid #66c7ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.cap.red{background:linear-gradient(180deg,#5a0714,#2e030a);border-color:#ffb9c3}.photo{width:min(5vw,96px);height:min(5vw,96px);min-width:44px;min-height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#18283c}.jersey{width:min(4.6vw,88px);height:min(4vw,74px);min-width:42px;min-height:36px;margin-top:.2vw;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(10px,.7vw,15px);clip-path:polygon(22% 0,38% 9%,62% 9%,78% 0,100% 24%,84% 38%,84% 100%,16% 100%,16% 38%,0 24%);border:2px solid #fff}.jersey.blue{background:linear-gradient(160deg,#0b79c9,#073b72)}.jersey.red{background:linear-gradient(160deg,#e32a45,#8f1025)}.role{font-size:clamp(9px,.6vw,13px);color:#ffe15a;font-weight:900;margin-top:.15vw}.name{font-size:clamp(15px,1.25vw,25px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.capteam{font-size:clamp(9px,.6vw,13px);font-weight:800}.badge{flex:0 0 auto;width:clamp(36px,2.7vw,52px);height:clamp(36px,2.7vw,52px);border-radius:50%;background:#ffd21a;color:#4d0710;display:flex;align-items:center;justify-content:center;font-weight:1000;border:2px solid #fff}.status{margin-top:.2vw;padding:.3vw .7vw;border-radius:999px;background:#4d0710aa;border:1px solid #ffffff55;font-size:clamp(9px,.65vw,13px);font-weight:1000;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{flex:0 0 8%;min-height:42px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center;background:linear-gradient(90deg,#b10f1e,#e21b2e,#b10f1e);font-size:clamp(14px,1.35vw,27px);font-weight:1000}.info b{color:#ffe15a}.over{flex:0 0 14%;min-height:65px;background:#07111f;display:flex;align-items:center;justify-content:center;padding:.5vw}.overbox{width:min(72%,1100px);height:92%;border-radius:12px;background:#0c1b2d;border:1px solid #ffffff33;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.25vw}.overhead{font-size:clamp(9px,.7vw,15px);font-weight:1000}.balls{display:flex;gap:.35vw;justify-content:center}.ball{min-width:clamp(24px,2vw,40px);height:clamp(24px,2vw,40px);border-radius:50%;background:#101b2a;border:1px solid #ffffff44;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(9px,.7vw,14px)}.ball.boundary{background:#ffd21a;color:#4d0710}.ball.wicket{background:#111;color:#ff5d70}.ball.extra{background:#fff;color:#8b1027}.cards{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1.25fr 1fr}.card{min-width:0;padding:1.3vw;overflow:hidden}.bat{background:linear-gradient(135deg,#078ac4,#18a9dc 60%,#0789bf)}.bat2{background:linear-gradient(135deg,#0782ba,#20a7dc 60%,#087fb5)}.bowl{background:linear-gradient(135deg,#b61d4b,#d63c62 60%,#9e173e)}.title{font-size:clamp(16px,1.9vw,38px);font-weight:1000;text-transform:uppercase;margin-bottom:.7vw}.player{font-size:clamp(20px,2.3vw,44px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{font-size:clamp(24px,2.4vw,46px);font-weight:1000;color:#ffe13a;margin-top:.2vw}.sub{font-size:clamp(11px,1vw,20px);font-weight:900;margin-top:.5vw}.strike{display:inline-block;margin-top:.6vw;padding:.25vw .7vw;border-radius:999px;background:#ffd21a;color:#4d0710;font-size:clamp(11px,1vw,19px);font-weight:1000}.off{background:#ffffff22;color:#fff}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#ffe13a;font-size:clamp(16px,1.3vw,28px);font-weight:1000;text-align:center;padding:20px}.error{color:#ffb6b6}
@media(max-width:700px){.wrap{padding:.5vw}.hero{grid-template-columns:1fr 1.4fr 1fr}.side{padding:1vw}.flag{min-width:40px;min-height:40px}.cards{grid-template-columns:1.25fr 1.25fr 1fr}.player{font-size:clamp(15px,3vw,28px)}.stats{font-size:clamp(17px,3vw,30px)}}
</style>
</head>
<body>
<div class="wrap"><div class="board" id="board"><div class="empty">LOADING LIVE SCORE…</div></div></div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(window.location.search);const matchId=(params.get('match_id')||'').trim();let timer=null;let busy=false;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=n=>'https://ui-avatars.com/api/?name='+encodeURIComponent(n||'Captain')+'&size=256&background=15263c&color=ffffff&bold=true&format=png';
const flag=n=>{const s=String(n||'').toLowerCase();if(s.includes('india'))return '🇮🇳';if(s.includes('west indies'))return '🌴';if(s.includes('australia'))return '🇦🇺';if(s.includes('england'))return '🏴';if(s.includes('south africa'))return '🇿🇦';if(s.includes('sri lanka'))return '🇱🇰';if(s.includes('pakistan'))return '🇵🇰';if(s.includes('bangladesh'))return '🇧🇩';if(s.includes('new zealand'))return '🇳🇿';if(s.includes('afghanistan'))return '🇦🇫';return '🏳️'};
function captain(c,i,team,code){if(!c)return '';return '<div class="cap '+(i?'red':'')+'"><img class="photo" src="'+esc(c.image||img(c.name))+'" onerror="this.src=\''+img(c.name)+'\'"><div class="jersey '+(i?'red':'blue')+'">'+esc(code||'TEAM')+'</div><div class="role">CAPTAIN</div><div class="name">'+esc(c.name)+'</div><div class="capteam">'+esc(flag(team))+' '+esc(team)+'</div></div>'}
function balls(co){const a=Array.isArray(co&&co.balls)?co.balls:[];if(!a.length)return '<span class="ball">—</span>';return a.map(x=>{const l=String(x.label||'');let c='ball';if(l==='4'||l==='6')c+=' boundary';if(/^W/.test(l))c+=' wicket';if(/^(WD|NB|LB|B)/.test(l))c+=' extra';return '<span class="'+c+'">'+esc(l)+'</span>'}).join('')}
function render(m){
 const bi=Number(m.batting_index||0)===1?1:0,bowli=bi?0:1;const t1=m.team1||'TEAM 1',t2=m.team2||'TEAM 2';const bat=bi?t2:t1,bowl=bowli?t2:t1;const bflag=bi?(m.team2_flag||flag(t2)):(m.team1_flag||flag(t1));const oflag=bowli?(m.team2_flag||flag(t2)):(m.team1_flag||flag(t1));const bscore=bi?(m.team2_score||'-'):(m.team1_score||'-');const overs=bi?(m.team2_overs||''):(m.team1_overs||'');const caps=m.captains||[];const bats=m.batsmen||[];const b1=bats[0]||{},b2=bats[1]||{},bo=m.bowler||null;const crr=m.crr||'-',part=m.partnership||'-';
 document.getElementById('board').innerHTML='<div class="hero"><div class="side"><div class="flag">'+esc(bflag)+'</div><div><div class="team">'+esc(bat)+'</div><div class="score">'+esc(bscore)+'</div><div class="overs">'+esc(overs?overs+' OVERS':'')+'</div></div></div><div class="middle"><div class="battle">CAPTAINS BATTLE</div><div class="vs">VS</div><div class="caps">'+captain(bi?caps[1]:caps[0],0,bat,bi?m.team2_code:m.team1_code)+'<div class="badge">VS</div>'+captain(bowli?caps[1]:caps[0],1,bowl,bowli?m.team2_code:m.team1_code)+'</div><div class="status">'+esc(m.status||'LIVE')+'</div></div><div class="side right"><div><div class="team">'+esc(bowl)+'</div><div class="bowling">BOWLING</div></div><div class="flag">'+esc(oflag)+'</div></div></div><div class="info"><div>CRR: <b>'+esc(crr)+'</b></div><div>P\'SHIP: <b>'+esc(part)+'</b></div><div>'+esc(bat.toUpperCase())+' BATTING</div></div><div class="over">'+(m.current_over?'<div class="overbox"><div class="overhead">CURRENT OVER'+(m.current_over.over?' • '+esc(m.current_over.over):'')+(m.current_over.free_hit?' • FREE HIT':'')+'</div><div class="balls">'+balls(m.current_over)+'</div></div>':'')+'</div><div class="cards"><div class="card bat"><div class="title">BATTER 1</div><div class="player">'+esc(b1.name||'-')+'</div><div class="stats">'+esc(b1.runs==null?'-':b1.runs)+' ('+esc(b1.balls==null?'-':b1.balls)+')</div><div class="sub">LIVE BATTER • FACING BOWLER</div><div class="strike '+(b1.striker?'':'off')+'">'+(b1.striker?'🏏 ON STRIKE':'🏏 NOT ON STRIKE')+'</div></div><div class="card bat2"><div class="title">BATTER 2</div><div class="player">'+esc(b2.name||'-')+'</div><div class="stats">'+esc(b2.runs==null?'-':b2.runs)+' ('+esc(b2.balls==null?'-':b2.balls)+')</div><div class="sub">LIVE BATTER</div><div class="strike '+(b2.striker?'':'off')+'">'+(b2.striker?'🏏 ON STRIKE':'🏏 NOT ON STRIKE')+'</div></div><div class="card bowl"><div class="title">BOWLER • LIVE</div><div class="player">'+esc(bo&&bo.name||'-')+'</div><div class="stats">'+esc(bo?bo.overs:'-')+'-'+esc(bo?bo.maidens:'-')+'-'+esc(bo?bo.runs:'-')+'-'+esc(bo?bo.wickets:'-')+'</div><div class="sub">ECONOMY '+esc(bo&&bo.economy||'-')+'</div></div></div>';
}
function showError(text){document.getElementById('board').innerHTML='<div class="empty error">LIVE SCORE TEMPORARILY UNAVAILABLE<br><small>'+esc(text||'Retrying automatically…')+'</small></div>'}
async function load(){if(busy)return;if(!matchId){showError('No match_id in scoreboard URL');return}busy=true;try{const url='/selected-score?match_id='+encodeURIComponent(matchId)+'&t='+Date.now();const r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j&&j.match){render(j.match)}else{throw new Error((j&&j.error)||'No live match data')}}catch(e){console.error('scoreboard live update failed',e);showError(e.message)}finally{busy=false}}
load();timer=setInterval(load,3000);window.addEventListener('pageshow',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body>
</html>
